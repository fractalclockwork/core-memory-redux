[project]
name = "core-memory-redux"
version = "0.0.0"
description = "Magnetic core memory array driver + SIL digital twin (host tooling baseline)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "PySpice",
    "pytest",
]

[tool.uv]
package = false

[dependency-groups]
writeup = [
    "matplotlib",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["spice/py"]
